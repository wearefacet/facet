name: E2E

on:
  schedule:
    # Sundays at 03:00 UTC. The suite is long; manual dispatch covers the rest.
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Docker and Compose are preinstalled on hosted runners.
      # The script bounds every phase with `timeout` and tears each
      # stack down; one scenario failing does not stop the others.
      - name: Run the e2e suite
        run: sh e2e/run-suite.sh
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts
          retention-days: 7
