# Seed currencies — the ISO-4217 list-one (SIX Group) circulating set.
# Excluded by the behaviour contract: precious metals (XAU XAG XPT XPD), the
# SDR (XDR), bond units (XBA XBB XBC XBD), fund / unit-of-account codes
# (XAD XSU XUA BOV CLF COU MXV CHE CHW USN UYI UYW), the test code (XTS) and
# no-currency (XXX).
#
# Symbols (the ISO list carries none) come from currency-symbol-map, curated
# where the source is wrong or absent (KGS, UZS, BOB, XCG, SLE, VED, ZWG).
# Names and digits are the ISO list's own.
#
# Document ids equal the tickers (readable URLs). The registry keys on
# content.ticker, so generic-UI rows with ULID ids stay valid.
#
# Defaults from the doctype: favorite false, grouping standard — only
# overrides are explicit here. `active` is stated on every row: the basic
# setup enables CHF, CNY, EUR, GBP, JPY, USD. Every other row ships inactive;
# an admin enables more from the Configure Currency page. A currency created
# by hand still starts active (the doctype default).
