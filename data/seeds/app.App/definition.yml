doctype: App
domain: app
schema_version: 1
aggregate_root: true
display_name: "{{ name }}"
description: "A registered external application that uses Facet as its data and identity source. An App never runs inside the Facet process and never touches the database directly. Its grants declare the ceiling of what the application may reach; effective permission is the intersection of the grant and the active role (grant ∩ role), computed per operation at the service layer."
icon: app-window
fields:
  slug:
    type: string
    required: true
    unique: true
    title: Slug
    description: "URL-safe unique identifier for the app. Immutable after creation. Lowercase alphanumeric with hyphens (e.g. 'crm-portal')."
    pattern: "^[a-z0-9][a-z0-9-]*$"
    pattern_flags: ""
    min: 1
    max: 64
    filters: [equality, text_search]
  name:
    type: string
    required: true
    title: "Display Name"
    description: "Human-readable name shown on the consent screen and in admin listings."
  description:
    type: longtext
    title: Description
    description: "Long-form description shown on the consent screen so the user understands what the app will do."
  client_id:
    type: string
    unique: true
    read_only: true
    title: "Client ID"
    description: "Public identifier of the app, autogenerated as a ULID by the create lifecycle hook. Read-only: callers cannot supply or modify it. The hook always populates it, so the field is present on every stored document despite the absence of `required: true` (which would conflict with `read_only` at validation time)."
    filters: [equality]
  client_type:
    type: enum
    default: public
    title: "Client Type"
    description: "OAuth client type. 'public' is a browser or native client: it signs in through the authorization-code + PKCE flow (consent screen) and stores no secret. 'confidential' adds a backend component: the app signs in through the consent screen and can additionally authenticate as itself through an app-owned API key. Both types appear in the launcher."
    values:
      - public
      - confidential
    filters: [equality]
  redirect_uris:
    type: array
    title: "Redirect URIs"
    description: "HTTPS URIs (any host) or HTTP URIs on a loopback host (localhost, a *.localhost subdomain, 127.0.0.1, ::1) the app may redirect to after authorization. Request time matches a presented URI exactly, except that an entry whose port is '*' (http loopback hosts only) matches any port — RFC 8252, the OS assigns the local listener's port. Any other '*' is rejected at write time."
    items:
      type: string
  allowed_origins:
    type: array
    title: "Allowed Origins"
    description: "Origins permitted for CORS on the token endpoint and the API. Each entry is a bare origin (scheme + host + optional port)."
    items:
      type: string
  service_role_id:
    type: reference
    doctype: iam.Roles
    title: "Service Role"
    description: "The iam.Roles document a backend app (client_type 'confidential') authenticates as. Set from the wizard's permissions step. The key-issuance path pins it as the service account's single role; effective permission is grant ∩ role, computed per request."
  service_account_id:
    type: reference
    doctype: iam.Account
    title: "Service Account"
    description: "The machine identity (iam.Account with service_account: true) this app authenticates through. Provisioned by the API-key issuance path; absent for frontend apps."
  active_deployment:
    type: reference
    doctype: app.Deployment
    title: "Active Deployment"
    description: "The app.Deployment document currently served at this app's host. Set by the deploy route's activate step (deploy + activate share one transaction); rolling back is a PATCH pointing it at an older deployment. Absent until the first deploy."
  host:
    type: string
    unique: true
    title: Host
    description: "Exact hostname Facet serves this app's active deployment at (e.g. 'hr.app.company.tld'). Optional: an app without a host is never dispatched. Bare lowercase hostname — no scheme, no port, no path, no wildcard characters — and never one of Facet's own hosts; the deployment target supplies the port at serve time. Validated by the create/update Lua hook; the dispatcher's reserved-host fall-through is the defence-in-depth backstop."
  status:
    type: enum
    title: Status
    description: "Lifecycle status of the app registration. 'draft' (default) means the app exists but is not yet active; 'active' means the app is in use; 'disabled' suppresses issuance and API access until re-enabled."
    values:
    - key: draft
      color: "#64748b"
    - key: active
      color: "#008f79"
    - key: disabled
      color: "#d84c50"
    default: draft
    filters: [equality]
  no_launcher:
    type: boolean
    default: false
    title: "No Launcher"
    description: "When true, the app never appears in the dashboard launcher. For headless registrations — a CLI tool is reached through its client, not through the dashboard."
    filters: [equality]
  no_asset:
    type: boolean
    default: false
    title: "No Asset"
    description: "When true, the app is not a deploy target: the deploy route refuses it, and the Lua hook rejects a host (nothing is ever served). For headless registrations such as the CLI tool."
    filters: [equality]
  assistant_enabled:
    type: boolean
    default: false
    title: "Assistant Enabled"
    description: "When true, the app may open assistant conversations through the chat package (POST /api/assistant/app/conversations). The gate reads this field live on every create and on every streamed message, so a flip applies on the next message. A confidential (backend) app cannot enable it: no browser surface exists to host the chat, so the Lua hook refuses the combination."
    filters: [equality]
  assistant_prompt:
    type: longtext
    title: "Assistant Prompt"
    description: "The app's own instructions for its assistant, appended to the system prompt as the 'App instructions' block. Optional: an empty value appends nothing. Baked into each conversation at creation, so a change reaches only new conversations."
  compatible_roles:
    type: array
    title: "Compatible Roles"
    description: "Optional list of iam.Roles ids used to filter the launcher. Metadata only: this list is never consulted during authorization. Effective permission is always grant ∩ role, computed per operation."
    items:
      type: string
  owner_id:
    type: reference
    doctype: iam.Account
    title: "Owner"
    description: "The iam.Account that owns this app registration. Used for listing and launcher scoping; not a permission grant."
  grants:
    type: array
    title: Grants
    description: "Ceiling on what the app may reach. Each entry declares a target doctype path and a list of action declarations, each carrying its own required flag. Targets are concrete — the wildcard form 'domain.*' is refused at authoring time (code 'wildcard_target'). A grant is policy, not secret material: it lives in the document (and therefore the event log) so its changes are audited. Confers no rights by itself; effective permission is grant ∩ role, computed per operation at the service layer."
    items:
      type: object
      title: Grant
      description: "A single grant entry: a target doctype path plus a list of (action, required) pairs."
      properties:
        target:
          type: string
          required: true
          title: Target
          description: "The concrete doctype path the grant covers, e.g. 'crm.Contact'. The domain wildcard 'domain.*' is refused at authoring time; bare doctype names and the global '*.*' wildcard are not accepted."
        actions:
          type: array
          required: true
          title: Actions
          description: "Action declarations the app may perform on the target. Permitted action names: 'read', 'write', 'delete', or a named action declared on the target doctype. 'write' is an alias that covers create and update. The 'required' flag is per action: a required action must be present in the active role (a role that lacks it is rejected); an optional action contributes to the effective scope only when the role grants it."
          items:
            type: object
            title: Grant Action
            description: "A single (action, required) declaration."
            properties:
              name:
                type: string
                required: true
                title: Name
                description: "The action name. 'read', 'write', 'delete', or a named action declared on the target doctype."
              required:
                type: boolean
                default: false
                title: Required
                description: "When true, a role that lacks this action is rejected. When false (the default), the action is granted only if the role permits it; its absence never rejects the role."

# The deploy named action is the gate action of the deploy route
# (`POST /Api/app/:id/deploy`): a caller deploys this app when its role (and,
# for app-scoped callers, its grant ceiling) carries `deploy` on `app.App`.
# The named `export.deploy` function exists to satisfy ScriptValidator — the
# deploy mutation is not a document action; the multipart route remains the
# only deploy entry point.
actions:
  deploy:
    args: {}
