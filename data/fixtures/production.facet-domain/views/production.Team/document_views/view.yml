---
content:
  kind: view
  template:
    type: col
    children:
    - type: header
      title: $name
    - type: grid
      layout: 3 1
      children:
      - type: col
        children:
        - type: section
          label: Overview
          children:
          - type: input
            field: description
      - type: sidebar
        children:
        - type: record-meta
          history: true
    - tabs:
      - type: tab
        label: Members
        children:
        - type: relation
          view: table
          label: Members
          limit: 25
          source:
            rel: members
            kind: children
          doctype: production.TeamMember
          columns:
          - key: account
            label: Account
          - key: role
            label: Role
            width: 130px
      type: tabs
  parent_doctype: production.Team
meta:
  parent_id: production.Team