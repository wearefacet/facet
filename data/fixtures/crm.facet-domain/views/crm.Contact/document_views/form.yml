---
content:
  kind: form
  template:
    type: col
    children:
    - type: section
      label: Identity
      children:
      - type: row
        layout: repeat(2, minmax(160px, 1fr))
        children:
        - type: input
          field: first_name
        - type: input
          field: last_name
      - type: row
        layout: minmax(200px, 1fr) minmax(280px, 2fr)
        children:
        - type: input-text
          field: email
          label: Email
          required: true
          inputType: email
        - type: input
          field: phone
    - type: section
      label: Professional
      children:
      - type: row
        layout: minmax(200px, 1fr) minmax(280px, 2fr)
        children:
        - type: input
          field: job_title
        - type: input
          field: department
      - type: row
        layout: repeat(2, minmax(160px, 1fr))
        children:
        - type: input
          field: role
        - type: input
          field: is_primary
    - type: section
      label: Account
      children:
      - type: input
        field: owner_id
  parent_doctype: crm.Contact
meta:
  parent_id: crm.Contact
