---
content:
  kind: view
  template:
    type: col
    children:
    - type: header
      chips:
      - industry
      subtitle: $company_id
      statusField: status
      title: $name
    - type: grid
      layout: 3 1
      children:
      - type: col
        children:
        - type: section
          label: Firmographics
          children:
          - type: field
            label: Industry
            value: $industry
      - type: sidebar
        children:
        - type: section
          label: Owner
          children:
          - type: field
            value: $owner_id
        - type: record-meta
          history: true
  parent_doctype: crm.Prospect
meta:
  parent_id: crm.Prospect