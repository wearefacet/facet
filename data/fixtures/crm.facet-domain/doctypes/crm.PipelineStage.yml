---
content:
  icon: git-branch
  color: "#9C27B0"
  domain: crm
  fields:
    name:
      type: string
      title: Stage Name
      unique: true
      required: true
      filters:
        - equality
        - text_search
      description: The display name of the pipeline stage (e.g. 'Prospecting', 'Negotiation').
    color:
      type: color
      title: Display Color
      description: Hex color code for UI display (e.g. '#4CAF50').
    order:
      type: integer
      title: Sort Order
      required: true
      description: The 1-based sort order of this stage in the pipeline.
    is_closing_stage:
      type: boolean
      title: Is Closing Stage
      default: false
      filters:
        - equality
      description: Whether this stage is considered a closing stage.
    probability_default:
      type: integer
      title: Default Probability
      default: 0
      description: Default win probability (0-100) for deals in this stage.
  doctype: PipelineStage
  description: A configurable stage in the sales pipeline. Each stage has a name,
    sort order, default probability, and display color.
  display_name: "{{ name }}"
  search: "{{ name }}"
  aggregate_root: true
  schema_version: 1
meta:
  parent_id: crm
