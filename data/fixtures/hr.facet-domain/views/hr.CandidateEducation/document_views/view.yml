---
content:
  kind: view
  template:
    type: col
    children:
    - type: header
      subtitle: $degree
      title: $school
    - type: grid
      layout: 3 1
      children:
      - type: col
        children:
        - type: section
          label: Education
          children:
          - type: field
            label: School
            value: $school
          - type: field
            label: Degree
            value: $degree
          - type: field
            label: Field of Study
            value: $field
        - type: section
          label: Timeline
          children:
          - type: field
            label: Start Year
            value: $start
          - type: field
            label: End Year
            value: $end
          - type: field
            label: GPA
            value: $gpa
      - type: sidebar
        children:
        - type: record-meta
          history: true
  parent_doctype: hr.CandidateEducation
meta:
  parent_id: hr.CandidateEducation