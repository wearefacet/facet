---
content:
  kind: view
  template:
    type: col
    children:
    - type: header
      chips:
      - event_type
      subtitle: $effective_date
    - type: grid
      layout: 3 1
      children:
      - type: col
        children:
        - type: section
          label: Changes
          children:
          - type: if
            field: new_title
            children:
            - type: field
              label: New Title
              value: $new_title
          - type: if
            field: new_salary
            children:
            - type: field
              label: New Salary
              value: $new_salary
          - type: if
            field: note
            children:
            - type: field
              label: Note
              value: $note
        - type: section
          label: Timeline
          children:
          - type: field
            label: Sequence
            value: $seq
      - type: sidebar
        children:
        - type: record-meta
          history: true
  parent_doctype: hr.CareerEvent
meta:
  parent_id: hr.CareerEvent
