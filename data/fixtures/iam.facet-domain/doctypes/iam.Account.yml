---
content:
  icon: user-cog
  domain: iam
  fields:
    email:
      type: string
      title: Email
      unique: true
      pattern: ^[^@]+@[^@]+\.[^@]+$
      required: true
      filters:
        - equality
        - text_search
      description: The account's email address, used for authentication and identification.
      pattern_flags: ""
    roles:
      type: array
      items:
        type: reference
        doctype: iam.Roles
      title: Roles
      description: The list of role documents assigned to this account, stored as
        qualified reference ids ({domain}.{Doctype}.{id}).
    status:
      type: enum
      title: Status
      values:
      - key: pending
        color: "#a9692d"
      - key: active
        color: "#008f79"
      - key: suspended
        color: "#c05f2a"
      - key: disabled
        color: "#d84c50"
      default: active
      filters:
        - equality
      description: The current status of the account. `pending` marks an invited account
        that has not completed its bootstrap yet; it may log in with its temporary
        password but is otherwise inactive until first use.
    mfa_enabled:
      type: boolean
      title: MFA Enabled
      default: false
      filters:
        - equality
      description: Whether the account has multi-factor authentication enabled.
    must_change_pw:
      type: boolean
      title: Must Change Password
      default: false
      filters:
        - equality
      description: When true, the next login short-circuits into the password-change
        bootstrap before any session is issued. Cleared by the change-password and
        password-reset flows.
    service_account:
      type: boolean
      title: Service Account
      default: false
      filters:
        - equality
      description: A machine identity. A service account cannot log in with email and
        password and cannot receive password-reset emails; it authenticates through
        API keys instead. It still holds roles and organizational_unit scopes like
        any other account.
    organizational_unit:
      type: string
      title: Organizational Unit
      default: "/"
      filters:
        - equality
        - text_search
      description: A folder-like path that identifies the account's organizational
        unit. Always begins and ends with '/' (e.g. '/', '/engineering/',
        '/engineering/backend/'). A null value falls back to the '/' root at
        creation. Used by RBAC scope predicates via the $organizational_unit token.
    federated_identities:
      type: array
      title: Federated Identities
      description: OIDC identities linked to this account. Each entry binds an external
        provider's durable subject (`sub`). The join key is (provider, subject) —
        never email.
      filters:
        - membership
      items:
        type: object
        properties:
          provider:
            type: string
            required: true
          subject:
            type: string
            required: true
          linked_at:
            type: datetime
            required: true
    default_role:
      type: reference
      title: Default Role
      doctype: iam.Roles
      description: The role used by default when no explicit role is requested during
        login, stored as a qualified reference id ({domain}.{Doctype}.{id}). Falls
        back to the first assigned role if not set.
    name:
      type: string
      title: Display Name
      required: true
      description: A human-readable display name for the account.
  doctype: Account
  description: A user account in the identity and access management domain. Each
    Account represents an authenticated actor with assigned roles.
  search: "{{ email }} {{ name }}"
  display_name: "{{ name }}"
  aggregate_root: true
  schema_version: 1
  script: !read_file iam.Account.lua
meta:
  parent_id: iam
