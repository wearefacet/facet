<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		<!-- The pre-paint theme script carries the per-request CSP nonce
		     placeholder; hooks.server.ts replaces it and sends the matching
		     Content-Security-Policy header. See src/lib/csp.ts. -->
		<script nonce="%facet.nonce%">
			(function () {
				try {
					var t = localStorage.getItem('facet:theme');
					if (t !== 'dark' && t !== 'light') {
						t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.setAttribute('data-theme', t);
				} catch (_) {}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
