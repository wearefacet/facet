# Facet release stack — postgres + redis + backend + frontend + Caddy edge.
# Read together with docker/Caddyfile.prod and docker/.env.example (copy it
# to docker/.env). doc/plans/container-release.md §5.7.
#
# Only Caddy publishes host ports. Internal traffic is plain HTTP inside the
# compose network; Caddy terminates the browser TLS hop, so
# iam.secure_cookies: true works.

name: facet

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facet}
      POSTGRES_USER: ${POSTGRES_USER:-facet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see docker/.env.example}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: facet
    restart: unless-stopped
    environment:
      APP_ENV: production
      # One password source: compose interpolates both sides from the same
      # keys, so the Postgres password exists in exactly one place.
      DATABASE_URL: postgres://${POSTGRES_USER:-facet}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see docker/.env.example}@postgres:5432/${POSTGRES_DB:-facet}
      # Every `!env NAME` of the shipped config example except FACET_REDIS_URL
      # (compose points that one at the redis service). A missing value fails
      # the boot loud at config load.
      FACET_HOST: ${FACET_HOST:?FACET_HOST is required - see docker/.env.example}
      FACET_BASE_URL: ${FACET_BASE_URL:?FACET_BASE_URL is required - see docker/.env.example}
      FACET_ARTIFACT_BASE_URL: ${FACET_ARTIFACT_BASE_URL:?FACET_ARTIFACT_BASE_URL is required - see docker/.env.example}
      FACET_ARTIFACT_GRANT_SECRET: ${FACET_ARTIFACT_GRANT_SECRET:?FACET_ARTIFACT_GRANT_SECRET is required - see docker/.env.example}
      FACET_REDIS_URL: redis://redis:6379/0
      FACET_MAIL_FROM_ADDRESS: ${FACET_MAIL_FROM_ADDRESS:?FACET_MAIL_FROM_ADDRESS is required - see docker/.env.example}
      FACET_MAIL_FROM_NAME: ${FACET_MAIL_FROM_NAME:?FACET_MAIL_FROM_NAME is required - see docker/.env.example}
      FACET_SMTP_HOST: ${FACET_SMTP_HOST:?FACET_SMTP_HOST is required - see docker/.env.example}
      FACET_SMTP_USERNAME: ${FACET_SMTP_USERNAME:?FACET_SMTP_USERNAME is required - see docker/.env.example}
      FACET_SMTP_PASSWORD: ${FACET_SMTP_PASSWORD:?FACET_SMTP_PASSWORD is required - see docker/.env.example}
      FACET_SECRETS_MASTER_KEY: ${FACET_SECRETS_MASTER_KEY:?FACET_SECRETS_MASTER_KEY is required - see docker/.env.example}
    volumes:
      - artifact-store:/data/store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: facet-frontend
    restart: unless-stopped
    environment:
      # The reserved service-host pattern: the SSR /Api rewrite targets the
      # backend service directly (plain HTTP inside the network).
      BACKEND_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-3443}:${HTTPS_PORT:-3443}"
      # Port 80 stays off the host surface in the localhost topology (the
      # default maps it to a loopback high port). A real-domain .env
      # publishes it: CADDY_HTTP_PUBLISH=80:80
      - "${CADDY_HTTP_PUBLISH:-127.0.0.1:18080:80}"
    environment:
      FACET_HOSTNAME: ${FACET_HOSTNAME:-facet.localhost}
      HTTPS_PORT: ${HTTPS_PORT:-3443}
      BACKEND_URL: http://backend:3000
      FRONTEND_URL: http://frontend:3000
    volumes:
      - caddy-data:/data
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
    networks:
      default:
        aliases:
          - facet.localhost
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  pg-data:
  redis-data:
  caddy-data:
  artifact-store:
