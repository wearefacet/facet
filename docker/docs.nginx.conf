# The docs site server block — the only config the container changes in the
# stock nginx-unprivileged image (its main nginx.conf already ships the
# unprivileged pid/temp paths, the mime types include, and conf.d/*.conf).
# The prod edge (an nginx reverse proxy on the host, driven by ansible)
# terminates TLS and forwards here over plain HTTP.

# One Cache-Control for every response, chosen by path. Hashed build output
# is immutable; everything else (HTML, the .md twins, llms.txt, sitemaps,
# robots.txt) must revalidate, so an edit ships on the next reload. The map
# keeps every header at server level — nginx drops server-level add_header
# directives inside any location that declares its own, so per-location
# headers would silently shed the security headers.
map $uri $docs_cache_control {
	~^/_astro/    "public, max-age=31536000, immutable";
	~^/diagrams/  "public, max-age=31536000, immutable";
	default       "public, max-age=0, must-revalidate";
}

server {
	listen 8080;
	listen [::]:8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;
	charset utf-8;

	# On-the-fly gzip for the text payloads. gzip_types REPLACES the inherited
	# http-level list (array directives substitute, they do not merge), so this
	# line is the complete effective set: text/html is always compressed.
	gzip on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/javascript text/xml application/javascript application/json application/xml image/svg+xml;

	# Inherited by every location below — none of them declares its own
	# add_header. `always` keeps them on the 404 responses too.
	add_header Cache-Control $docs_cache_control always;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header X-Frame-Options SAMEORIGIN always;

	error_page 404 /404.html;

	location / {
		try_files $uri $uri/ =404;
	}

	# The .md twins and the .md source pages: the stock mime.types has no
	# markdown entry and would serve them as downloads. The empty types block
	# clears the inherited table for this location only; default_type fills it.
	location ~* \.md$ {
		types { }
		default_type text/markdown;
	}
}
