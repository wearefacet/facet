  - id: lucia-item-no-price
    persona: lucia
    url: /equipment/Item/EQ-2026-0001
    out: build/team-access-2.png
    wait: main
    settle: 1200

  # Captured-once shots. These PNGs are committed assets, but the standard
  # capture run above does not reproduce them:
  #
  #   run-facet-1/2/3  taken against the throwaway tutorial-1 stack (the
  #                    welcome tour only opens for a freshly seeded admin,
  #                    and the password screen only appears during a
  #                    forced change).
  #   team-access-3/4/5 taken on the shared dev instance while a throwaway
  #                    account (pat@brightwater.example) was created,
  #                    assigned the warehouse role, given a one-time
  #                    password, and deleted again. The flow lives in
  #                    tmp/wp14-t4-pat-final.mjs (scratch, not committed).
  #
  # Re-shoot them by re-running the corresponding tutorial by hand.
  #
  # run-facet-1  the sign-in screen of a fresh stack (tutorial 1)
  # run-facet-2  the welcome tour, first step — taken on the shared dev
  #               instance as admin@example.tld (the show_welcome flag was
  #               left true for the shot; tmp/wp14-tour-shot.mjs), not on
  #               the throwaway tutorial-1 stack
  # run-facet-3  the Set a new password screen (tutorial 1)
  # team-access-3  the New Account form, filled (tutorial 4, step 1)
  # team-access-4  the Temporary password generated dialog (tutorial 4, step 1)
  # team-access-5  the Assignments page, By account, Warehouse assigned
