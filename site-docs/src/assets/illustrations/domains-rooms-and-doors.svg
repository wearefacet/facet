@keyframes fct-dom-gl330{0%,10.00%{opacity:0}13.00%,32.00%{opacity:1}35.00%,100%{opacity:0}}
@keyframes fct-dom-leaf330{0%,10.00%{transform:translateY(0)}14.00%,32.00%{transform:translateY(-56px)}36.00%,100%{transform:translateY(0)}}
@keyframes fct-dom-key330{0%,9.00%{opacity:0}12.00%,32.00%{opacity:1}35.00%,100%{opacity:0}}
@keyframes fct-dom-gl630{0%,44.00%{opacity:0}47.00%,66.00%{opacity:1}69.00%,100%{opacity:0}}
@keyframes fct-dom-leaf630{0%,44.00%{transform:translateY(0)}48.00%,66.00%{transform:translateY(-56px)}70.00%,100%{transform:translateY(0)}}
@keyframes fct-dom-key630{0%,43.00%{opacity:0}46.00%,66.00%{opacity:1}69.00%,100%{opacity:0}}
@keyframes fct-dom-t1{0%,14.00%{transform:translate(0,0);opacity:0}15.50%{transform:translate(0,0);opacity:1}19.00%{transform:translate(40px,6px)}24.00%{transform:translate(90px,-14px);opacity:1}26.00%,100%{transform:translate(90px,-14px);opacity:0}}
@keyframes fct-dom-t2{0%,48.00%{transform:translate(0,0);opacity:0}49.50%{transform:translate(0,0);opacity:1}53.00%{transform:translate(60px,-12px)}58.00%{transform:translate(140px,-6px);opacity:1}60.00%,100%{transform:translate(140px,-6px);opacity:0}}
@media (prefers-reduced-motion:reduce){.fct-dom *{animation:none!important}.fct-dom .smil{display:none}}
</style>
