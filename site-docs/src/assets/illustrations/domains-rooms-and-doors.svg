<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" class="fct-dom" role="img" aria-labelledby="fct-dom-t fct-dom-d">
<title id="fct-dom-t">Domains keep their records inside</title>
<desc id="fct-dom-d">Three domains sit side by side like rooms: clients (companies and contacts), rentals (bookings) and equipment (items and repairs). Records stay inside their own room. Between clients and rentals is a granted door: the client's name rides onto the booking. Between rentals and equipment is another granted door: the booking appears on the tent's reservations. Each door opens only for what was granted, then closes.</desc>
<style>
.fct-dom{--c-bg:var(--surface);--c-deep:var(--sunken);--c-card:var(--surface);--c-line:var(--border-strong);--c-hair:var(--border);--c-ink:var(--text);--c-muted:var(--text-2);--c-accent:var(--accent);--c-accent-ink:var(--accent-ink);--c-on-accent:var(--on-accent);--c-soft:var(--accent-weak);--c-ok:var(--ok);--c-ok-soft:var(--ok-weak);--c-alert:var(--danger);}
.fct-dom text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--c-ink);}
.fct-dom .card{fill:var(--c-card);stroke:var(--c-line);stroke-width:1.5;}
@keyframes fct-dom-jig{0%,100%{transform:translate(0,0)}25%{transform:translate(1.5px,-1px)}50%{transform:translate(-1px,1.5px)}75%{transform:translate(1px,1px)}}
@keyframes fct-dom-slot{0%,23.00%{opacity:1}26.00%,93.00%{opacity:0}96.00%,100%{opacity:1}}
