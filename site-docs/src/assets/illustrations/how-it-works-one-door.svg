@keyframes fct-flow-chk{0%{stroke:var(--line)}10.26%{stroke:var(--line)}10.67%{stroke:var(--amber)}14.84%{stroke:var(--amber)}18.17%{stroke:var(--line)}32.66%{stroke:var(--line)}33.07%{stroke:var(--amber)}37.24%{stroke:var(--amber)}40.57%{stroke:var(--line)}60.26%{stroke:var(--line)}60.67%{stroke:var(--amber)}64.84%{stroke:var(--amber)}68.17%{stroke:var(--line)}100%{stroke:var(--line)}}
@keyframes fct-flow-deny{0%{stroke:transparent}94.58%{stroke:transparent}95.00%{stroke:var(--alert)}1.67%{stroke:var(--alert)}5.00%{stroke:transparent}100%{stroke:transparent}}
@keyframes fct-flow-x{0%{opacity:0}94.58%{opacity:0}95.00%{opacity:1}1.67%{opacity:1}5.00%{opacity:0}100%{opacity:0}}
@keyframes fct-flow-tick{0%{opacity:0}11.51%{opacity:0}11.92%{opacity:1}15.26%{opacity:1}18.59%{opacity:0}33.91%{opacity:0}34.32%{opacity:1}37.66%{opacity:1}40.99%{opacity:0}61.51%{opacity:0}61.92%{opacity:1}65.26%{opacity:1}68.59%{opacity:0}100%{opacity:0}}
@keyframes fct-flow-c0{0%{fill:var(--bg);stroke:var(--line)}44.58%{fill:var(--bg);stroke:var(--line)}45.00%{fill:var(--soft);stroke:var(--amber)}50.83%{fill:var(--soft);stroke:var(--amber)}54.17%{fill:var(--bg);stroke:var(--line)}100%{fill:var(--bg);stroke:var(--line)}}
