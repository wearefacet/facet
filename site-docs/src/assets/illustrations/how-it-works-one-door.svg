@keyframes fct-flow-c2{0%{fill:var(--bg);stroke:var(--line)}19.58%{fill:var(--bg);stroke:var(--line)}20.00%{fill:var(--soft);stroke:var(--amber)}25.83%{fill:var(--soft);stroke:var(--amber)}29.17%{fill:var(--bg);stroke:var(--line)}100%{fill:var(--bg);stroke:var(--line)}}
