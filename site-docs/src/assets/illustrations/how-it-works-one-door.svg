<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" class="fct-flow" role="img" aria-labelledby="fct-flow-t fct-flow-d">
<title id="fct-flow-t">One door, one set of checks, one memory</title>
<desc id="fct-flow-d">People, apps and AI agents all reach Facet through the same door: sign in once and Facet knows who you are and which role you act as. Every read and write then passes that role's checks. Allowed requests reach the domains (equipment, clients, rentals); every change is also remembered. A request the role does not allow is refused at the checks.</desc>
<style>
.fct-flow{--bg:var(--surface);--card:var(--surface);--ink:var(--text);--muted:var(--text-2);--line:var(--border-strong);--amber:var(--accent);--gold:var(--accent-ink);--light:var(--accent-press);--soft:var(--accent-weak);--alert:var(--danger);--slab:var(--text);--slabline:var(--text);}
[data-theme='dark'] .fct-flow{--slab:var(--surface-2);--slabline:var(--border-strong);}
.fct-flow text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink);}
.fct-flow .card{fill:var(--card);stroke:var(--line);stroke-width:1.5;}
.fct-flow .bob,.fct-flow .pulse,.fct-flow .flow,.fct-flow .fade{transform-box:fill-box;transform-origin:center;}
@keyframes fct-flow-bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-6px) rotate(calc(var(--r,0deg) * -1))}}
