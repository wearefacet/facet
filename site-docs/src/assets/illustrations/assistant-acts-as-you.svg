<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" class="fct-asst" role="img" aria-labelledby="fct-asst-t fct-asst-d">
<title id="fct-asst-t">The assistant works as you, under your role</title>
<desc id="fct-asst-d">Nadia asks the assistant which tents are free on 14 June. The assistant reads the equipment list with Nadia's role: it sees four tents, while two others are outside her role and stay locked. It answers with the three free tents she may see. Nadia then asks it to add a note to booking BK-0412. The note is saved, and the booking's history shows the change under Nadia's name, marked as assistant work, next to the earlier changes by Nadia and Tom.</desc>
