<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" class="fct-doc" role="img" aria-labelledby="fct-doc-t fct-doc-d">
<title id="fct-doc-t">A document remembers its past</title>
<desc id="fct-doc-d">A booking document for a marquee tent. At 9:14 Nadia creates it. At 11:02 Tom moves the date from 14 June to 21 June. At 11:05 Tom rolls that change back: the date returns to 14 June and his earlier change is marked as reverted. Every change stays on the record's timeline with a name and a time.</desc>
<style>
.fct-doc{--bg:var(--surface);--card:var(--surface);--ink:var(--text);--muted:var(--text-2);--line:var(--border-strong);--amber:var(--accent);--gold:var(--accent-ink);--light:var(--accent-press);--soft:var(--accent-weak);--alert:var(--danger);--slab:var(--text);--slabline:var(--text);}
[data-theme='dark'] .fct-doc{--slab:var(--surface-2);--slabline:var(--border-strong);}
.fct-doc text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink);}
.fct-doc .card{fill:var(--card);stroke:var(--line);stroke-width:1.5;}
.fct-doc .bob,.fct-doc .pulse,.fct-doc .flow,.fct-doc .fade{transform-box:fill-box;transform-origin:center;}
@keyframes fct-doc-bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-6px) rotate(calc(var(--r,0deg) * -1))}}
@keyframes fct-doc-pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fct-doc-flow{to{stroke-dashoffset:-24}}
@keyframes fct-doc-ck1{0%{opacity:0}3.33%{opacity:0}6.25%{opacity:1}27.50%{opacity:1}30.42%{opacity:0}100%{opacity:0}}
@keyframes fct-doc-ck2{0%{opacity:0}28.33%{opacity:0}31.25%{opacity:1}57.50%{opacity:1}60.42%{opacity:0}100%{opacity:0}}
@keyframes fct-doc-ck3{0%{opacity:0}58.33%{opacity:0}61.25%{opacity:1}94.17%{opacity:1}97.08%{opacity:0}100%{opacity:0}}
@keyframes fct-doc-r0{0%{opacity:0;transform:translateY(6px)}5.00%{opacity:0;transform:translateY(6px)}7.92%{opacity:1;transform:translateY(0)}95.00%{opacity:1;transform:translateY(0)}97.92%{opacity:0;transform:translateY(6px)}100%{opacity:0;transform:translateY(6px)}}
@keyframes fct-doc-r1{0%{opacity:0;transform:translateY(6px)}6.25%{opacity:0;transform:translateY(6px)}9.17%{opacity:1;transform:translateY(0)}95.00%{opacity:1;transform:translateY(0)}97.92%{opacity:0;transform:translateY(6px)}100%{opacity:0;transform:translateY(6px)}}
@keyframes fct-doc-hl{0%,28.33%{opacity:0}30.00%{opacity:1}40.00%{opacity:0}58.33%{opacity:0}60.00%{opacity:1}70.00%,100%{opacity:0}}
@keyframes fct-doc-d14{0%{opacity:0;transform:translateY(-8px)}7.50%{opacity:0;transform:translateY(-8px)}10.42%{opacity:1;transform:translateY(0)}28.33%{opacity:1;transform:translateY(0)}31.25%{opacity:0;transform:translateY(-8px)}59.17%{opacity:0;transform:translateY(-8px)}62.08%{opacity:1;transform:translateY(0)}95.00%{opacity:1;transform:translateY(0)}97.92%{opacity:0;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-8px)}}
@keyframes fct-doc-d21{0%{opacity:0;transform:translateY(8px)}29.17%{opacity:0;transform:translateY(8px)}32.08%{opacity:1;transform:translateY(0)}58.33%{opacity:1;transform:translateY(0)}61.25%{opacity:0;transform:translateY(8px)}100%{opacity:0;transform:translateY(8px)}}
@keyframes fct-doc-st{0%{opacity:0;transform:translateY(6px)}8.75%{opacity:0;transform:translateY(6px)}11.67%{opacity:1;transform:translateY(0)}95.00%{opacity:1;transform:translateY(0)}97.92%{opacity:0;transform:translateY(6px)}100%{opacity:0;transform:translateY(6px)}}
@keyframes fct-doc-grow{0%,3.33%{transform:scaleY(0)}8.33%{transform:scaleY(.2)}28.33%{transform:scaleY(.2)}33.33%{transform:scaleY(.6)}58.33%{transform:scaleY(.6)}63.33%,95.00%{transform:scaleY(1);opacity:1}97.92%,100%{transform:scaleY(1);opacity:0}}
@keyframes fct-doc-e1{0%{opacity:0;transform:translateX(-10px)}5.83%{opacity:0;transform:translateX(-10px)}8.75%{opacity:1;transform:translateX(0)}95.00%{opacity:1;transform:translateX(0)}97.92%{opacity:0;transform:translateX(-10px)}100%{opacity:0;transform:translateX(-10px)}}
@keyframes fct-doc-e2{0%{opacity:0;transform:translateX(-10px)}30.83%{opacity:0;transform:translateX(-10px)}33.75%{opacity:1;transform:translateX(0)}95.00%{opacity:1;transform:translateX(0)}97.92%{opacity:0;transform:translateX(-10px)}100%{opacity:0;transform:translateX(-10px)}}
@keyframes fct-doc-e2box{0%,60.83%{stroke-dasharray:none;opacity:1}63.33%,100%{stroke-dasharray:5 4;opacity:.75}}
@keyframes fct-doc-e3{0%{opacity:0;transform:translateX(-10px)}60.83%{opacity:0;transform:translateX(-10px)}63.75%{opacity:1;transform:translateX(0)}95.00%{opacity:1;transform:translateX(0)}97.92%{opacity:0;transform:translateX(-10px)}100%{opacity:0;transform:translateX(-10px)}}
@keyframes fct-doc-rev{0%{opacity:0;transform:scale(.8)}65.83%{opacity:0;transform:scale(.8)}68.75%{opacity:1;transform:scale(1)}95.00%{opacity:1;transform:scale(1)}97.92%{opacity:0;transform:scale(.8)}100%{opacity:0;transform:scale(.8)}}
@keyframes fct-doc-undo{0%,60.00%{stroke-dashoffset:220;opacity:1}65.83%{stroke-dashoffset:0}95.00%{stroke-dashoffset:0;opacity:1}97.92%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes fct-doc-head{0%{opacity:0}65.42%{opacity:0}68.33%{opacity:1}95.00%{opacity:1}97.92%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fct-doc *{animation:none!important}.fct-doc .smil{display:none}}
</style>
<rect class="card" x="60" y="70" width="350" height="330" rx="16"/>
<path d="M76 70 H394 A16 16 0 0 1 410 86 V134 H60 V86 A16 16 0 0 1 76 70 Z" fill="var(--soft)"/>
<line x1="60" y1="134" x2="410" y2="134" stroke="var(--line)" stroke-width="1.5"/>
