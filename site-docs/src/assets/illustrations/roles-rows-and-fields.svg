<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" class="fct-roles" role="img" aria-labelledby="fct-roles-t fct-roles-d">
<title id="fct-roles-t">Roles: which rows you reach, which fields you read</title>
<desc id="fct-roles-d">Tom has the sales role. A row rule lets through only the clients he owns, so his list shows his five clients out of nine. Lucía has the warehouse role. A field rule hides the purchase price, so when she opens an item she sees its name, stock and rental price, and no purchase price. The same checks apply in the portal, in apps, through the API and in the assistant.</desc>
