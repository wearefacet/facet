.fct-apps text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--c-ink);}
.fct-apps .card{fill:var(--c-card);stroke:var(--c-line);stroke-width:1.5;}
