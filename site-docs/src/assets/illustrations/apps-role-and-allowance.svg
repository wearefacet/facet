<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" class="fct-apps" role="img" aria-labelledby="fct-apps-t fct-apps-d">
<title id="fct-apps-t">An app asks for rights; the person's role must have them</title>
<desc id="fct-apps-d">The check-out app asks for four rights: see equipment items, mark an item checked out and read today's bookings are required; change booking dates is optional. When Lucía (warehouse role) signs in, her role has all three required rights, so the app opens; she lacks the optional one, so changing dates is switched off for her. Her other rights, logging repairs and seeing client addresses, are not asked for and never reach the app. When Tom (sales role) signs in, his role lacks the required right to mark items checked out, so the app does not open for him.</desc>
